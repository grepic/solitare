version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: solitaire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: solitaire
      POSTGRES_PASSWORD: solitaire_dev_password
      POSTGRES_DB: solitaire_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solitaire']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: solitaire-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev
    container_name: solitaire-maildev
    restart: unless-stopped
    ports:
      - '1080:1080'  # Web UI
      - '1025:1025'  # SMTP

volumes:
  postgres-data:
  redis-data:
